name: Instalador de Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Descargar ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - run: npm ci

      - name: Tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Compilar instalador (firmado para las actualizaciones)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build

      - name: Preparar archivos de la versión
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter *-setup.exe | Select-Object -First 1
          $name = "Subir-Beat_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item $exe.FullName "salida/$name"
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $notes = if (Test-Path NOVEDADES.txt) { (Get-Content NOVEDADES.txt -Raw).Trim() } else { "" }
          $latest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/v$version/$name" } }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content salida/latest.json -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v4
        with:
          name: Subir-Beat-instalador
          path: salida/*
          if-no-files-found: error

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            salida/*.exe
            salida/latest.json
          body_path: NOVEDADES.txt
          make_latest: true
